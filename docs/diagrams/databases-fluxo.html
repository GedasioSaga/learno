<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Databases: da tela ao banco</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Learno</p>
    <h1>Da tela ao banco: o caminho de uma database</h1>
    <p class="subtitle">Do comando <code>/database</code> no editor até a única escrita permitida em <code>database_record_values</code>.</p>

    <svg viewBox="0 0 720 968" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="databases-fluxo-title databases-fluxo-desc">
      <title id="databases-fluxo-title">Da tela ao banco: o caminho de uma database</title>
      <desc id="databases-fluxo-desc">Diagrama de arquitetura mostrando o fluxo de uma database no Learno: o comando /database cria o bloco no editor, um carregador React compõe quatro comandos IPC e traduz o resultado, um contêiner puro recebe o estado por prop, um registro de views resolve a grade da Tabela e delega cada célula ao spec da propriedade, e a edição de uma célula chama o comando IPC apply_record_value_changes, que desce até record_values.rs — o único caminho de escrita em database_record_values, onde um valor vazio remove a linha em vez de virar um JSON vazio.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES (drawn first, before arrows/nodes) ============ -->
      <rect x="140" y="32" width="360" height="592" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="160" y="36" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="45" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FRONTEND</text>

      <rect x="140" y="656" width="360" height="208" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="160" y="660" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="669" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BACKEND</text>

      <!-- ============ ARROWS (before nodes) ============ -->
      <!-- c1: N1 -> N2 -->
      <line x1="320" y1="128" x2="320" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- c2: N2 -> N3 -->
      <line x1="320" y1="224" x2="320" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- c3: N3 -> N4 -->
      <line x1="320" y1="320" x2="320" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- c4: N4 -> N5, labeled -->
      <line x1="320" y1="416" x2="320" y2="448" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="332" y="424" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ESTADO POR PROP</text>
      <!-- c5: N5 -> N6 -->
      <line x1="320" y1="512" x2="320" y2="544" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- c6: N6 -> N7, labeled, crosses zone boundary -->
      <line x1="320" y1="608" x2="320" y2="688" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="332" y="640" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="649" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EDITAR CÉLULA</text>
      <!-- c7: N7 -> N8 -->
      <line x1="320" y1="752" x2="320" y2="784" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ============ NODES ============ -->

      <!-- N1: Comando /database -->
      <rect x="180" y="64" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="64" width="280" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="188" y="70" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="208" y="79" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AÇÃO</text>
      <text x="320" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Comando /database</text>
      <text x="320" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">actions.ts — database + view Tabela</text>

      <!-- N2: DatabaseBlockView -->
      <rect x="180" y="160" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="160" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="188" y="166" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="208" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
      <text x="320" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DatabaseBlockView</text>
      <text x="320" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NodeView do TipTap</text>

      <!-- N3: useDatabase (loader) -->
      <rect x="180" y="256" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="256" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="188" y="262" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="208" y="271" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="320" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useDatabase (loader)</text>
      <text x="320" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 IPC em paralelo + resolve-schema.ts</text>

      <!-- N4: DatabaseContainer (puro) -->
      <rect x="180" y="352" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="352" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="188" y="358" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="208" y="367" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PURO</text>
      <text x="320" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DatabaseContainer</text>
      <text x="320" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">estado por prop — nunca chama invoke</text>

      <!-- N5: Registro de views -->
      <rect x="180" y="448" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="448" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="188" y="454" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="208" y="463" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="320" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registro de views (Tabela)</text>
      <text x="320" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">view-spec.ts → views/table/register.ts</text>

      <!-- N6: PropertySpec por coluna -->
      <rect x="180" y="544" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="544" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="188" y="550" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="212" y="559" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CÉLULA</text>
      <text x="320" y="578" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PropertySpec por coluna</text>
      <text x="320" y="594" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">renderValue / renderEditor por tipo</text>

      <!-- N7: apply_record_value_changes -->
      <rect x="180" y="688" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="688" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="188" y="694" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="208" y="703" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IPC</text>
      <text x="320" y="722" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">apply_record_value_changes</text>
      <text x="320" y="738" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">database_commands.rs (Tauri)</text>

      <!-- N8: record_values.rs — FOCAL -->
      <rect x="180" y="784" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="784" width="280" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="188" y="790" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="212" y="799" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQLITE</text>
      <text x="320" y="818" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">record_values.rs</text>
      <text x="320" y="834" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RecordValueRepository</text>

      <!-- ============ CALLOUTS (margin, right side) ============ -->
      <!-- I4: único caminho de escrita -->
      <text x="700" y="706" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">único caminho de escrita</text>
      <text x="700" y="724" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">em database_record_values (I4)</text>
      <path d="M 700 730 Q 580 765 460 800" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="460" cy="800" r="2" fill="#eb6c36"/>

      <!-- I1: valor vazio = ausência da linha -->
      <text x="700" y="838" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">valor vazio = linha ausente</text>
      <text x="700" y="856" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">nunca um JSON vazio (I1)</text>
      <path d="M 700 862 Q 580 850 460 832" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="460" cy="832" r="2" fill="#2d3142"/>

      <!-- ============ LEGEND ============ -->
      <line x1="30" y1="888" x2="690" y2="888" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="904" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="36" y="922" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="58" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">componente</text>

      <rect x="140" y="922" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="162" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">único caminho de escrita</text>

      <line x1="352" y1="929" x2="384" y2="929" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="392" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fluxo de dados</text>

      <path d="M 520 929 L 552 929" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="560" y="933" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">nota / invariante</text>
    </svg>
  </div>
</body>
</html>
