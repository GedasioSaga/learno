[package]
name = "learno"
version = "0.1.0"
description = "Learno — estudo com notas em blocos, repetição espaçada e mapa mental"
authors = ["Gedasio Filho"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "learno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "protocol-asset": exige o próprio Tauri que qualquer app usando
# app.security.assetProtocol (tauri.conf.json) declare a feature — sem ela
# o build falha com "does not match the allowlist defined under
# tauri.conf.json". Necessária para EDT-024..027: é como `convertFileSrc`
# consegue servir a mídia gravada em `$APPDATA/media` de volta ao WebView.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# EDT-028: busca de metadado de bookmark (título/descrição/favicon) via HTTP
# no lado Rust, fora da política de CORS que bloqueia um `fetch` direto do
# WebView na maioria dos sites. Escopo de URL vive em
# src-tauri/capabilities/default.json (permissão "http:default").
tauri-plugin-http = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fractional_index = "2.0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
# Só a feature "test" do Tauri (mock_builder/mock_context), pra testar
# ipc::commands::page_* sem um AppHandle real — nenhuma dependência nova,
# a mesma já usada em [dependencies] com mais uma feature para os testes.
tauri = { version = "2", features = ["test"] }
# Only used by tests/backup_dump.rs to pull host/port/db/user apart from a
# postgres:// URL for the two-database dump/restore round trip — already
# resolved in Cargo.lock as sqlx's own transitive dependency, so this adds
# no new supply-chain surface, just a direct name for an existing crate.
url = "2.5.8"
